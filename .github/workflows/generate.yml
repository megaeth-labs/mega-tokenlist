name: Generate Token List

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - '.github/workflows/generate.yml'
  workflow_dispatch:

concurrency:
  group: generate-token-list
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Requires the mega-putin installation and an Always allow bypass on main.
      - name: Create token for mega-putin
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MEGA_PUTIN_CLIENT_ID }}
          private-key: ${{ secrets.MEGA_PUTIN_PK }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Format files
        run: npm run format

      - name: Generate token list
        run: npm run generate

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'bot(ci): regenerate token list'
          commit_user_name: 'mega-putin[bot]'
          commit_user_email: '265285328+mega-putin[bot]@users.noreply.github.com'
          commit_author: 'mega-putin[bot] <265285328+mega-putin[bot]@users.noreply.github.com>'
          file_pattern: '*.json data/**'
